server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.13.0"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.1"
      snapshot: false

  server:
    password: "veyra123"
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: false
      vimeo: false
      http: true
      local: false

    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      rotation: true
      distortion: true
      channelMix: true
      lowPass: true

    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_MUSIC
      - WEB
      - TVHTML5EMBEDDED

  lavasrc:
    providers:
      - "ytsearch"
      - "scsearch"
      - "spsearch"
      - "dzsearch"
      - "amsearch"
      - "jssearch"

    sources:
      spotify: true
      applemusic: true
      deezer: true
      jiosaavn: true
      tidal: false
      yandexmusic: false
      flowerytts: false

    spotify:
      clientId: "YOUR_SPOTIFY_CLIENT_ID"
      clientSecret: "YOUR_SPOTIFY_CLIENT_SECRET"

    applemusic:
      countryCode: "US"

    deezer:
      masterDecryptionKey: "YOUR_DEEZER_KEY"

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  file:
    max-history: 3
    max-size: 10MB

  level:
    root: INFO
    lavalink: INFO
